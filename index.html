<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mind</title>
<meta name="description" content="恐怖指数研究所 Mind：毎朝の相場の局面と、今大切な言葉、陥りやすいバイアス">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mind">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a1a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=LINE+Seed+JP:wght@400;700;800&display=swap">
<style>
:root{
  /* the same navy palette as the other apps */
  --bg:#0a0a1a; --panel:#111127; --ink:#f2f2f7; --ink2:#c4c4d4; --muted:#8a8aa6; --line:#2a2a4a; --chip:#1a1a36; --accent:#7fa8ff;
  --red:#ca2323; --up:#4CAF50; --dn:#F44336; --amber:#FF9800;
  --f-tick:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"LINE Seed JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
a{color:inherit}
.num{font-family:var(--f-tick);font-stretch:82%;font-variant-numeric:tabular-nums}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 0 8px}
.brand{display:flex;align-items:center;gap:10px}
.langseg{position:absolute;right:0;top:18px;display:flex;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}.langseg button{appearance:none;border:0;background:transparent;color:var(--muted);font:700 12px/1 var(--f-body);letter-spacing:.04em;padding:7px 9px;border-radius:6px;cursor:pointer}.langseg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.9),0 1px 2px rgba(0,0,0,.4)}
.avatar{width:44px;height:44px;border-radius:10px;flex:none;box-shadow:0 0 0 1px var(--line)}
h1{margin:0;font-size:21px;font-weight:800;letter-spacing:.04em;line-height:1.15}
.ed{font-size:12px;color:var(--muted);margin-top:2px}
.seg{display:flex;background:var(--chip);border-radius:8px;padding:3px;gap:2px;margin-top:10px}
.seg button{flex:1;appearance:none;border:0;background:transparent;color:var(--ink2);font:500 13.5px/1 var(--f-body);padding:9px 6px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.9),0 1px 2px rgba(0,0,0,.4);font-weight:700}
.sub{display:flex;gap:2px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.sub::-webkit-scrollbar{display:none}
.sub button{flex:1 0 auto;appearance:none;border:0;background:transparent;color:var(--muted);font:500 13px/1 var(--f-body);padding:8px 4px 9px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.sub button[aria-pressed="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.date{padding:18px 2px 6px}
.date b{display:block;font-family:var(--f-tick);font-stretch:85%;font-weight:800;font-size:52px;line-height:1;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.date b i{font-style:normal;font-family:var(--f-body);font-size:24px;font-weight:800;margin:0 4px 0 2px}
.date span{display:block;margin-top:8px;font-size:13px;color:var(--muted);letter-spacing:.08em}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.ph{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 8px;margin:2px 0 10px}
.ph .asof{margin-left:auto}
.ph h2{white-space:nowrap;margin:0;font-size:17px;font-weight:800;letter-spacing:.04em;color:var(--ink)}
.ph .asof{white-space:nowrap;font-size:12px;color:var(--muted)}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
/* the four acts */
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:2px 0 12px}
.acts div{position:relative;text-align:center;padding:6px 2px 5px;border-radius:8px;background:#0d0d22;border:1px solid var(--line);color:var(--muted);font-size:10.5px;line-height:1.3}
.acts div b{display:block;font-size:11px;color:var(--ink2);font-weight:700}
.acts div.on{background:var(--red);border-color:var(--red);color:#fff}
.acts div.on b{color:#fff}
.scene{font-size:20px;font-weight:800;letter-spacing:.04em;line-height:1.25}
.scene small{display:block;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin-bottom:2px}
.sdesc{margin:6px 0 0;color:var(--ink2);font-size:14px;line-height:1.65}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kv div{background:#0d0d22;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.kv span{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap}
.kv b{display:block;font-family:var(--f-tick);font-stretch:82%;font-weight:700;font-size:20px;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.kv small{display:block;font-family:var(--f-tick);font-stretch:82%;font-size:11.5px;color:var(--ink2);white-space:nowrap}
.kv b.j{font-family:var(--f-body);font-stretch:100%;font-size:15px;line-height:1.55}
/* the word */
.word{margin:2px 0 0;font-weight:700;font-size:16px;line-height:1.7}
.wmeta{font-size:12px;color:var(--muted)}
/* biases */
.bias{padding:10px 0;border-top:1px solid var(--line)}
.bias:first-of-type{border-top:0;padding-top:2px}
.ph+.bias,.grp+.bias{border-top:0;padding-top:2px}
.bias h3{margin:0 0 3px;font-size:16px;font-weight:700;line-height:1.6}
.bias h3 i{font-style:normal;font-size:10.5px;font-weight:700;color:var(--muted);margin-left:6px;letter-spacing:.04em}
.bias p{margin:0;font-size:14px;line-height:1.7;color:var(--ink2)}
.cap{display:block;font-size:12px;color:var(--muted);margin:2px 0 1px}
.word+.bias{border-top:1px solid var(--line);margin-top:8px;padding-top:10px}
.asofl{margin:8px 0 0;font-size:12px;color:var(--muted);text-align:right}
.ky{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.ph+.ky,.kyu+.ky{border-top:0;padding-top:2px}
.ky .v{flex:none;width:22px;padding-top:15px;text-align:center;font-family:"Hiragino Sans",var(--f-body);font-size:15px;font-weight:700;line-height:1.5}
.ky .vo{color:var(--ink)}.ky .vt{color:var(--ink2)}.ky .vx{color:var(--muted)}
.ky span{display:block;font-size:12px;color:var(--muted)}
.ky p{margin:1px 0 0;font-size:16px;font-weight:700;line-height:1.6}
.kyu{margin:0 0 6px;font-size:13px;color:var(--muted)}
.cure{margin-top:10px;padding:10px 12px;border-radius:10px;background:#0d0d22;border:1px solid var(--line);font-size:13px;line-height:1.7;color:var(--ink2)}
/* reference lists */
.grp{margin:16px 0 4px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.grp:first-of-type{margin-top:0}
.ref p{margin:0;padding:9px 0;border-top:1px solid var(--line);font-size:16px;font-weight:700;line-height:1.6}
.grp+p{border-top:0}
.ref p i{display:block;font-style:normal;font-weight:400;font-size:12px;color:var(--muted)}
.ref p.on{color:#fff}
.ref p.on i{color:var(--red)}
.act>h3{margin:16px 0 4px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.act>h3 small{display:block;font-size:12px;font-weight:400;letter-spacing:0;margin-top:1px}
.act{padding:0}
.act:first-of-type>h3{margin-top:0}
.act>h3+.bias{border-top:0;padding-top:2px}
.act.on>h3{color:#fff}
.bias.cur h3{color:#fff}
.bias.cur h3::after{content:"注意";display:inline-block;font-size:10px;font-weight:800;color:#fff;background:var(--red);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.act.on>h3::before{content:"今";display:inline-block;font-size:10px;font-weight:800;color:#fff;background:var(--red);border-radius:4px;padding:1px 5px;margin-right:6px;vertical-align:2px}
.an{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.grp+.an{border-top:0}
.an .v{flex:none;width:22px;text-align:center;font-family:"Hiragino Sans",var(--f-body);font-size:15px;font-weight:700;line-height:1.5}
.an .vo{color:var(--ink)}.an .vt{color:var(--ink2)}.an .vx,.an .vn{color:var(--muted)}
.an b{display:block;font-size:16px;font-weight:700;line-height:1.6}
.an span{display:block;font-size:12px;color:var(--muted)}
.mk{display:inline-block;vertical-align:-2px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.tally .mk{margin-right:2px}
.tally{display:flex;gap:16px;margin:2px 0 4px;font-size:12px;color:var(--muted)}
.tally b{font-family:var(--f-tick);font-stretch:85%;font-size:15px;color:var(--ink);margin-left:3px}
.bk{display:flex;align-items:center;gap:12px;text-decoration:none;padding:6px 0}
.bk+.bk{border-top:1px solid var(--line);padding-top:10px}
.bk img{width:44px;height:64px;border-radius:4px;object-fit:cover;flex:none;box-shadow:0 0 0 1px var(--line)}
.bk b{display:block;font-size:15px}
.bk span{display:block;font-size:12px;color:var(--accent)}
.bk em{margin-left:auto;font-style:normal;color:var(--accent);font-size:18px}
.foot{margin-top:18px;text-align:center;font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><img class="avatar" src="icons/icon-192.png" alt="" width="44" height="44">
      <div><h1>Mind</h1></div></div>
    <div class="langseg" id="lang" role="group" aria-label="Language"><button type="button" data-lang="ja">JP</button><button type="button" data-lang="en">EN</button></div>
    <nav class="seg" id="tabs">
      <button data-tab="today" aria-pressed="true">今日</button>
      <button data-tab="ref" aria-pressed="false">参照</button>
    </nav>
    <nav class="sub" id="subtabs" hidden>
      <button data-sub="words">言葉</button><button data-sub="toi">問い</button><button data-sub="heiho">兵法</button><button data-sub="biases">バイアス</button><button data-sub="anomaly">アノマリー</button>
    </nav>
  </header>
  <main>
    <div id="t-today">
      <div class="date" id="date"></div>
      <section class="panel" id="scene"><div class="empty">読み込み中…</div></section>
      <section class="panel" id="word"></section>
      <section class="panel" id="bias"></section>
      <section class="panel" id="toi"></section>
      <section class="panel" id="heiho"></section>
      <section class="panel" id="koyomi"></section>
      <section class="panel books" data-books="vix,shippai,heiho,anomaly"></section>
    </div>
    <div id="t-words" hidden><section class="panel ref" id="words"></section><section class="panel books" data-books="vix"></section></div>
    <div id="t-toi" hidden><section class="panel" id="toilist"></section><section class="panel books" data-books="shippai"></section></div>
    <div id="t-heiho" hidden><section class="panel" id="heiholist"></section><section class="panel books" data-books="heiho"></section></div>
    <div id="t-biases" hidden><section class="panel" id="acts"></section><section class="panel books" data-books="vix"></section></div>
    <div id="t-anomaly" hidden><section class="panel" id="anomaly"></section><section class="panel books" data-books="anomaly"></section></div>
  </main>
  <div class="foot">© 恐怖指数研究所 Gold Locks</div>
</div>
<script src="engine.js"></script>
<script src="calendar.js"></script>
<script src="words.js"></script>
<script>
const APP_VER="mind-v29";
const $=id=>document.getElementById(id);
const DATA_BASE="/mri-app/data/";
// language: shared with the other apps on this site ("lang" in localStorage)
let LANG=(()=>{try{const v=localStorage.getItem("lang");if(v==="ja"||v==="en")return v}catch(e){}return /^ja/i.test(navigator.language||"")?"ja":"en"})();
const L=(ja,en)=>LANG==="en"?en:ja;   // pick by language
const P=a=>Array.isArray(a)?(LANG==="en"?a[1]:a[0]):a;

// 第四章 30の言葉 [n, ja, en]
const {WORDS,BIAS,SCENES}=window.MindData;
const W={};WORDS.forEach(([g,ws])=>ws.forEach(([n,ja,en])=>W[n]={n,t:[ja,en],g}));

const BN=b=>L(BIAS[b][0],BIAS[b][2]),BT=b=>L(BIAS[b][1],BIAS[b][3]);
// [act, title, what happens, biases, short label]
const ACTS=[
  [["第一幕","Act I"],["平穏の中で","In the calm"],["風船が膨らんでいる。しかし誰も気づかない","The balloon is inflating, but no one notices"],["recency","bandwagon","overconf","planning"],["平穏","Calm"]],
  [["第二幕","Act II"],["針が刺さった瞬間","The needle strikes"],["VIXが急騰し始めた","VIX starts to spike"],["normalcy","confirm"],["針","Needle"]],
  [["第三幕","Act III"],["パニックの渦中","In the panic"],["市場が崩壊していく","The market is collapsing"],["herd"],["パニック","Panic"]],
  [["第四幕","Act IV"],["底と反転","Bottom and reversal"],["VIXが頂点に達した。株価が反転し始めた","VIX has peaked. Prices are starting to turn"],["loss","anchor","status"],["底と反転","Reversal"]]];

// 『相場のアノマリーを斬る』 終章: the 38 claims (39 verdicts); v: o ○, t △, x ×, n no verdict
const F={keep:["残っている","Still there"],fade:["減った","Faded"],never:["初めから無かった","Never there"],rev:["減って、反転した","Faded, then reversed"],undec:["決められない","Undecided"],
  pub:["公表されて消えた","Vanished after publication"],pubf:["公表されて減った","Faded after publication"],na:["測れない","Can't be measured"],same:["同上","Same as above"],wd:["反転したので取り下げ","Withdrawn: it reversed"],
  aYE:["年末年始の7営業日の別名","Another name for the year-end 7 days"],aYE2:["同じ7営業日の別名","Another name for the same 7 days"],aSM:["9月と年末年始の別名","Another name for September and the year-end window"],
  aS9:["甘い9か月の別名","Another name for the sweet 9 months"],aW6:["弱い6か月の別名","Another name for the weak 6 months"],aSep:["9月の別名","Another name for September"],aJan:["1月の別名","Another name for January"],aVal:["割安株の別名","Another name for value"]};
const ANOMALY=[
  [["序章　相場の外から来るもの","Prologue · From outside the market"],[["x",["水星逆行中は下がる","Stocks fall during Mercury retrograde"],"never"]]],
  [["第一部　カレンダー","Part 1 · The calendar"],[["o",["9月は悪い","September is bad"],"keep"],["t",["11月は上がる","November rises"],"fade"],["x",["夏枯れで8月は弱い","August is weak (summer doldrums)"],"never"],["x",["1月のバロメーター","The January barometer"],"never"],
    ["n",["年末は上がる","Year-end rises"],"aYE"],["n",["1月効果","The January effect"],"aYE2"],["t",["月末月初は上がる","The turn of the month rises"],"fade"],["t",["月の前半は強い","The first half of the month is strong"],"fade"],
    ["t",["月曜は下がる","Mondays fall"],"rev"],["t",["金曜は上がる","Fridays rise"],"rev"],["t",["祝日の前は上がる","Pre-holiday days rise"],"fade"],["t",["サンタクロース・ラリー","The Santa Claus rally"],"fade"],
    ["x",["Sell in May","Sell in May"],"aSM"],["x",["SQの日は荒れる","Triple witching days are volatile"],"never"],["t",["10月は荒れる","October is volatile"],"fade"]]],
  [["第二部　政治と政策","Part 2 · Politics and policy"],[["n",["3年目は最も強い","Year 3 is the strongest"],"aS9"],["n",["中間選挙の年は悪い","The midterm year is bad"],"aW6"],["x",["選挙の年は上がる","Election years rise"],"never"],["x",["選挙の翌年は弱い","Post-election years are weak"],"never"],
    ["o",["甘い9か月は強い","The sweet 9 months are strong"],"keep"],["o",["弱い6か月は弱い","The weak 6 months are weak"],"keep"],["n",["安値から高値まで46.8%","Midterm low to next-year high: 46.8%"],"na"],["t",["民主党のほうが高い","Returns are higher under Democrats"],"undec"],
    ["o",["FOMCの発表前は上がる（1994-2011）","Stocks rise before FOMC (1994-2011)"],"pub"],["x",["FOMCの発表前は上がる（2016-2026）","Stocks rise before FOMC (2016-2026)"],"same"]]],
  [["第三部　相場の外から","Part 3 · From outside the market"],[["t",["新月のころは上がる","Stocks rise around the new moon"],"undec"],["x",["秋は弱い","Autumn is weak"],"aSep"],["x",["冬は強い","Winter is strong"],"aYE"],["x",["旧NFL系が勝てば上がる","An old-NFL Super Bowl win means a rising year"],"never"]]],
  [["第四部　大きさと安さと勢いと振れ方","Part 4 · Size, value, momentum and volatility"],[["t",["小型株は高い","Small caps beat large caps"],"aJan"],["o",["サイズ効果は1月に集中する","The size effect is concentrated in January"],"pubf"],["t",["割安株は高い","Value beats growth"],"undec"],
    ["n",["バリュー効果は1月に集中する","The value effect is concentrated in January"],"wd"],["t",["上がる株は上がり続ける","Winners keep winning"],"undec"],["o",["直前1か月は戻る","Last month's losers bounce back"],"keep"],
    ["x",["2年から5年前は戻る","Losers of 2 to 5 years ago bounce back"],"aVal"],["t",["低ボラ株のほうが高い","Low-volatility stocks return more"],"undec"],["o",["低ボラ株はリスクに対して高い","Low-volatility stocks return more per unit of risk"],"keep"]]]];
// the verdict marks drawn as same-sized shapes (the font's ○△× come out in different sizes)
const SHAPE={o:'<circle cx="8" cy="8" r="6"/>',t:'<path d="M8 2.2 14.2 13.4H1.8Z"/>',x:'<path d="M3 3 13 13M13 3 3 13"/>',n:'<path d="M2.5 8h11"/>'};
const MARK={};for(const k in SHAPE)MARK[k]=`<svg class="mk" viewBox="0 0 16 16" width="15" height="15" aria-label="${{o:"○",t:"△",x:"×",n:"—"}[k]}">${SHAPE[k]}</svg>`;
// books stay in Japanese; 『VIXの声を聴け』 has an English edition, so English readers get that one
const BOOKS={vix:[["VIXの声を聴け","https://amzn.asia/d/0hrhh1Ny","icons/book-vix.jpg"],["Listen to VIX","https://amzn.asia/d/07rtXhVo","icons/book-vix-en.jpg"]],
  shippai:[["失敗の魔術師","https://amzn.asia/d/0hWKU73R","icons/book-shippai.jpg"],["失敗の魔術師","https://amzn.asia/d/0hWKU73R","icons/book-shippai.jpg"]],
  heiho:[["兵法に学べ","https://amzn.asia/d/02BQOi5d","icons/book-heiho.jpg"],["兵法に学べ","https://amzn.asia/d/02BQOi5d","icons/book-heiho.jpg"]],
  anomaly:[["相場のアノマリーを斬る","https://amzn.asia/d/0boQWl0D","icons/book-anomaly.jpg"],["相場のアノマリーを斬る","https://amzn.asia/d/0boQWl0D","icons/book-anomaly.jpg"]]};
const KAN=["〇","一","二","三","四","五","六","七","八","九","十","十一","十二"];
const BK=k=>P(BOOKS[k]),bookName=k=>{const b=BK(k)[0];return /^[\x00-\x7F]+$/.test(b)?b:`『${b}』`};

// 『失敗の魔術師』終章「四つの問い」, and the eight records the final chapter lines up (verbatim), with their chapters
const TOI=[["あなたの資産全体に対して、実際の露出は何倍か。","Against all your assets, how many times exposed are you, really?"],
  ["その現金は、何か仕事をしているか。","Is that cash doing any work?"],
  ["あなたの読みは、到着時刻まで合っている必要があるか。","Does your read have to be right down to the arrival time?"],
  ["外れたとき、それは保険料で済むか。","If you are wrong, does it cost no more than an insurance premium?"]];
const QL=q=>P(q).replace(/。$/,"");
const TEACH={

  burry:[4,"二年間、保険料を払った男","マイケル・バリーは、正しさが届く直前まで追い詰められ、犯罪者になる危険を冒して耐えた。そして20年かけて、外れても保険料で済む場所へ移った。","Michael Burry was cornered until just before being proven right, and held on at the risk of becoming a criminal. Over 20 years he moved to where being wrong costs only a premium."],

const SCENE_TOI={calm:[[1,"buffett"],[0,"livermore"]],after:[[0,"leo"],[1,"buffett"]],balloon:[[0,"leo"],[0,"ltcm"]],needle:[[2,"dalio"],[3,"burry"]],
  panic:[[1,"buffett"],[3,"simons"]],rebound:[[3,"burry"],[2,"marks"]],quiet:[[1,"marks"],[0,"livermore"]]};

const store={get:(k,d)=>{try{return localStorage.getItem("mind."+k)??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem("mind."+k,v)}catch(e){}}};
const state={tab:store.get("tab","today")==="ref"?"ref":"today",sub:store.get("sub","words")};
if(!["words","toi","heiho","biases","anomaly"].includes(state.sub))state.sub="words";
const MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
const fmtD=d=>{const y=Math.floor(d/10000),m=Math.floor(d/100)%100,dd=d%100;return L(`${y}年${m}月${dd}日`,`${MON[m-1].slice(0,3)} ${dd}, ${y}`)};
const toDate=d=>new Date(Math.floor(d/10000),Math.floor(d/100)%100-1,d%100);
const monthsBetween=(a,b)=>(Math.floor(b/10000)-Math.floor(a/10000))*12+(Math.floor(b/100)%100-Math.floor(a/100)%100);

async function load(){
  const get=f=>fetch(DATA_BASE+f,{cache:"no-cache"}).then(r=>{if(!r.ok)throw new Error(f);return r.json()});
  const [vix,daily,mri]=await Promise.all([get("vix.json"),get("vix_daily.json"),get("mri.json")]);
  const days=daily.high.map(x=>[x[0],x[1]]);
  // Cboe's history file can lag a few days; fill the gap with the daily VIX the MRI app keeps (a close, so a little under the high)
  const last=days[days.length-1][0];mri.daily.forEach(r=>{if(r[0]>last&&r[1])days.push([r[0],r[1],1])});
  // the day's reading is fixed at 7:00 Japan time: it uses the US sessions closed before today's date, never the live value
  // (?d=YYYYMMDD replays the reading made after that day's close, for checking the scenes against history)
  const asof=+new URLSearchParams(location.search).get("d");
  const cut=asof?x=>x[0]<=asof:x=>x[0]<fortuneDay();
  return {vix,days:days.filter(cut),mri:{...mri,daily:mri.daily.filter(cut)}};
}

function judge({vix,days,mri}){
  const {st,ev}=MindEngine.runEvents(days,vix.months);
  const i=st.length-1,s=st[i],day=days[i][0];
  // MRI signals, latched like the MRI app: technical bubble on CAPE, SELL and BUY on MRI
  const PIT=mri.pit||{},CERT={tbub:{},sell:{},buy:{}};(mri.certified||[]).forEach(c=>{if(CERT[c.signal])CERT[c.signal][c.date]=c.level});
  const R=mri.daily.map(r=>{const q=PIT[r[0]];if(!q)return r;const x=r.slice();x[6]=q[0];x[7]=q[1];return x});
  const up=(v,t)=>t.filter(x=>v>=x).length,dn=(v,t)=>t.filter(x=>v<=x).length;
  const tb=MindEngine.latch(R,r=>up(r[6],[.841345,.97725,.99865]),r=>r[6]<=.5,CERT.tbub);
  const se=MindEngine.latch(R,r=>up(r[7],[.8,.85,.9]),r=>r[7]<=.5,CERT.sell);
  const bu=MindEngine.latch(R,r=>dn(r[7],[.08,.06,.04]),r=>r[7]>=.5,CERT.buy);
  const k=R.length-1,mriNow=R[k][7],sig={tbub:tb[k],sell:se[k],buy:bu[k]};
  const done=ev.filter(e=>e.end),last=done[done.length-1],cur=ev.find(e=>!e.end);
  const recentNeedle=st.slice(-5).some(x=>x.high>=x.s1);
  let key;
  if(s.phase==="panic")key="panic";
  else if(s.phase==="rebound")key="rebound";
  else if(sig.buy)key="quiet";
  else if(recentNeedle)key="needle";
  else if(sig.tbub||sig.sell)key="balloon";
  else if(last&&monthsBetween(last.end,day)<12)key="after";
  else key="calm";
  return {key,day,s,approx:!!days[i][2],asof:mri.updatedAt,sig,mriNow,last,cur,sinceLast:last?monthsBetween(last.start,day):null};
}

// the verdicts come from the final chapter of 『相場のアノマリーを斬る』; cited by chapter like the other panels
const FINAL=()=>`${bookName("anomaly")}${L("終章"," · Final ch.")}`;
const VIXCH=n=>`${bookName("vix")}${L(`第${"〇一二三四五"[n]}章`,` · Ch. ${n}`)}`;
// the day turns over at 7:00 Japan time (after the US close), like a morning fortune; before that it is still yesterday
function fortuneDay(){const j=new Date(Date.now()+(9-7)*36e5);return j.getUTCFullYear()*10000+(j.getUTCMonth()+1)*100+j.getUTCDate()}
const fmtMD=d=>L(`${Math.floor(d/100)%100}/${d%100}`,`${MON[Math.floor(d/100)%100-1].slice(0,3)} ${d%100}`);
const jstTime=iso=>{const t=new Date(Date.parse(iso)+9*36e5);return `${t.getUTCMonth()+1}/${t.getUTCDate()} ${t.getUTCHours()}:${String(t.getUTCMinutes()).padStart(2,"0")}`};
const dayIndex=d=>Math.floor(toDate(d).getTime()/864e5);
const ph=(h,asof="")=>`<div class="ph"><h2>${h}</h2>${asof?`<span class="asof">${asof}</span>`:""}</div>`;
// 今日の暦: the calendar claims from 『相場のアノマリーを斬る』 that fall on today's US session, with the book's verdict
// on a day the US market is closed (weekends, holidays) it shows the next trading day's calendar instead
function renderKoyomi(n){
  const open=MindCalendar.isTrading(n),day=open?n:MindCalendar.nextTrading(n),K=MindCalendar.today(day);
  const d=toDate(day),md=`${d.getMonth()+1}/${d.getDate()}`,wk=L("日月火水木金土"[d.getDay()],["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()]);
  $("koyomi").innerHTML=ph(open?L("今日の暦","Today's calendar"):L(`${md}（${wk}）の暦`,`Calendar for ${wk} ${md}`),FINAL())+
    (open?"":`<p class="kyu">${L("今日は米国市場が休場。次の取引日の暦","US market closed today. The next trading day:")}</p>`)+
    (K.items.length?K.items.map(k=>`<div class="ky"><b class="v v${k.v}">${MARK[k.v]}</b><div><span>${P(k.when)} · ${P(k.fate)}</span><p>${P(k.claim)}</p></div></div>`).join(""):`<p class="kyu">${L("当たる通説はない","No claims fall on this day")}</p>`);
}
function renderToday(J){
  const tn=fortuneDay(),dt=toDate(tn);
  const wk=L("日月火水木金土"[dt.getDay()]+"曜日",["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][dt.getDay()]);
  $("date").innerHTML=LANG==="en"?`<b>${MON[dt.getMonth()]} ${dt.getDate()}</b><span>${wk}　${dt.getFullYear()}　·　7:00 JST</span>`
    :`<b>${dt.getMonth()+1}<i>月</i>${dt.getDate()}<i>日</i></b><span>${dt.getFullYear()}年　${wk}　·　7:00 更新</span>`;
  renderKoyomi(tn);
  if(!J)return;
  const [ai,name,desc,biases,words]=SCENES[J.key],act=ACTS[ai],s=J.s;
  const sigTxt=[J.sig.tbub?`${L("バブル","Bubble")} Lv.${J.sig.tbub}`:"",J.sig.sell?`SELL ${[0,80,85,90][J.sig.sell]}`:"",J.sig.buy?`BUY ${[0,8,6,4][J.sig.buy]}`:""].filter(Boolean);
  $("scene").innerHTML=ph(L("今の局面","Where we are"),VIXCH(5))+
    `<div class="acts">${ACTS.map((a,j)=>`<div class="${j===ai?"on":""}"><b>${P(a[0])}</b>${P(a[4])}</div>`).join("")}</div>
    <div class="scene"><small>${P(act[0])}　${P(act[1])}</small>${P(name)}</div>
    <p class="sdesc">${P(desc)}</p>
    <div class="kv">
      <div><span>${J.approx?"VIX":L("VIX 日足高値","VIX daily high")}</span><b>${s.high.toFixed(2)}</b><small>+1σ ${s.s1.toFixed(1)}</small><small>+2σ ${s.s2.toFixed(1)}</small></div>
      <div><span>MRI</span><b>${(J.mriNow*100).toFixed(1)}</b>${sigTxt.length?sigTxt.map(x=>`<small>${x}</small>`).join(""):`<small>${L("シグナルなし","No signal")}</small>`}</div>
      <div><span>${L("VIXイベント","VIX event")}</span><b>${J.cur?L("発生中","Under way"):J.sinceLast+`<small style='display:inline'>${L(" ヶ月前"," mo ago")}</small>`}</b><small>${J.cur?fmtD(J.cur.start)+"〜":J.last?fmtD(J.last.start):""}</small></div>
    </div><p class="asofl">${L(`${fmtMD(J.day)} 米国市場の引けまで`,`Through the US close of ${fmtMD(J.day)}`)}</p>`;
  // the word and the bias of the day turn over with the date (7:00 Japan time), among the scene's own
  const di=dayIndex(tn),main=W[words[di%words.length]],b=biases[di%biases.length];
  $("word").innerHTML=ph(L("今日の言葉","Word of the day"),VIXCH(4))+
    `<div class="wmeta">No. ${main.n}　${P(main.g)}</div><p class="word">${L("「","“")}${P(main.t)}${L("」","”")}</p>`;
  $("bias").innerHTML=ph(L("気をつけるバイアス","Bias to watch"),VIXCH(5))+`<div class="bias"><h3>${BN(b)}</h3><p>${BT(b)}</p></div>`;
  // the question of the day, with one of the eight records as its example
  const tp=SCENE_TOI[J.key][di%SCENE_TOI[J.key].length],q=TOI[tp[0]],t=TEACH[tp[1]];
  $("toi").innerHTML=ph(L("今日の問い","Question of the day"),`${bookName("shippai")}${L("終章"," · Final ch.")}`)+
    `<p class="word">${QL(q)}</p><div class="bias"><span class="cap">${L(`第${KAN[t[0]]}章「${t[1]}」`,`Ch. ${t[0]}`)}</span><p>${L(t[2],t[3])}</p></div>`;
  // the strategy of the day
  const hk=SCENE_HEIHO[J.key][di%SCENE_HEIHO[J.key].length],h=HEIHO[hk];
  // the principle comes from the final chapter's list; the line beneath it from the chapter that shows it
  const fromCh1=h[6]===1,same=fromCh1||h[4][0]==="終章";
  $("heiho").innerHTML=ph(L("今日の兵法","Strategy of the day"),`${bookName("heiho")}${fromCh1?L("第一章"," · Ch. 1"):L("終章"," · Final ch.")}`)+
    `<div class="bias">${same?"":`<span class="cap">${L(`${h[4][0]}「${h[5]}」`,h[4][1])}</span>`}<h3>${L(h[0],h[1])}</h3><p>${L(h[2],h[3])}</p></div>`;
}
function renderRef(){
  $("words").innerHTML=ph(L("30の言葉","30 words"),VIXCH(4))+
    WORDS.map(([g,ws])=>`<div class="grp">${P(g)}</div>`+ws.map(([n,ja,en])=>`<p><i>No. ${n}</i>${L(ja,en)}</p>`).join("")).join("");
  $("acts").innerHTML=ph(L("四幕と10のバイアス","Four acts, ten biases"),VIXCH(5))+
    ACTS.map(a=>`<div class="act"><h3>${P(a[0])}　${P(a[1])}<small>${P(a[2])}</small></h3>${a[3].map(b=>`<div class="bias"><h3>${BN(b)}</h3><p>${BT(b)}</p></div>`).join("")}</div>`).join("");
  const PARTS=[[["第一部　退場した者","Part 1 · Those forced out"],["ltcm","leo","livermore"]],[["第二部　戻ってきた者","Part 2 · Those who came back"],["burry","dalio","simons"]],[["第三部　渡さなかった者","Part 3 · Those who never handed it over"],["buffett","marks"]]];
  $("toilist").innerHTML=ph(L("四つの問い","Four questions"),`${bookName("shippai")}${L("終章"," · Final ch.")}`)+
    TOI.map((q,i)=>`<div class="an"><i class="v">${i+1}</i><div><b>${QL(q)}</b></div></div>`).join("")+
    `<div class="grp">${L("8つの記録","Eight records")}</div>`+
    PARTS.map(([g,ks])=>`<div class="grp">${P(g)}</div>`+ks.map(k=>{const t=TEACH[k];return `<div class="bias"><span class="cap">${L(`第${KAN[t[0]]}章「${t[1]}」`,`Ch. ${t[0]}`)}</span><p>${L(t[2],t[3])}</p></div>`}).join("")).join("");
  const HG=[[["繰り返し現れたもの","What kept recurring"],["makenai","basho","kachu","yamedoki","tettai"]],[["構えあって構えなし","A stance, and no stance"],["kamae","kakushin"]],[["第一部　宮本武蔵","Part 1 · Miyamoto Musashi"],["tateki"]]];
  $("heiholist").innerHTML=ph(L("兵法","Strategy"),bookName("heiho"))+
    HG.map(([g,ks])=>`<div class="grp">${P(g)}</div>`+ks.map(k=>{const h=HEIHO[k],same=h[6]===1||h[4][0]==="終章",cap=k==="basho"?L("第七章「桶狭間」・第八章「官渡」","Ch. 7, Ch. 8"):L(`${h[4][0]}「${h[5]}」`,h[4][1]);return `<div class="bias">${same?"":`<span class="cap">${cap}</span>`}<h3>${L(h[0],h[1])}</h3><p>${L(h[2],h[3])}</p></div>`}).join("")).join("");
  const all=ANOMALY.flatMap(g=>g[1]),cnt=v=>all.filter(a=>a[0]===v).length;
  $("anomaly").innerHTML=ph(L("38の通説","38 claims"),FINAL())+
    `<div class="tally"><span>${MARK.o}<b>${cnt("o")}</b></span><span>${MARK.t}<b>${cnt("t")}</b></span><span>${MARK.x}<b>${cnt("x")}</b></span><span>${L("判定なし","No verdict")}<b>${cnt("n")}</b></span></div>`+
    ANOMALY.map(([g,xs])=>`<div class="grp">${P(g)}</div>`+xs.map(([v,c,f])=>`<div class="an"><i class="v v${v}">${MARK[v]}</i><div><b>${P(c)}</b><span>${P(F[f])}</span></div></div>`).join("")).join("");
  document.querySelectorAll(".books").forEach(el=>{el.innerHTML=ph(L("関連書籍","Related books"))+el.dataset.books.split(",").map(k=>{const[,url,cv]=BK(k);
    return `<a class="bk" href="${url}" target="_blank" rel="noopener"><img src="${cv}" alt="" width="44" height="64"><div><b>${bookName(k)}</b><span>${L("Amazon で見る","View on Amazon")}</span></div><em>›</em></a>`}).join("")});
}
// two levels: 今日 / 参照, and under 参照 one tab per reference list
const TABS={today:["今日","Today"],ref:["参照","Reference"]};
const SUBS={words:["言葉","Words"],toi:["問い","Questions"],heiho:["兵法","Strategy"],biases:["バイアス","Biases"],anomaly:["アノマリー","Anomalies"]};
function renderTabs(){
  document.querySelectorAll("#tabs [data-tab]").forEach(b=>{b.textContent=P(TABS[b.dataset.tab]);b.setAttribute("aria-pressed",b.dataset.tab===state.tab)});
  document.querySelectorAll("#subtabs button").forEach(b=>{b.textContent=P(SUBS[b.dataset.sub]);b.setAttribute("aria-pressed",b.dataset.sub===state.sub)});
  $("subtabs").hidden=state.tab!=="ref";
  $("t-today").hidden=state.tab!=="today";
  Object.keys(SUBS).forEach(k=>$("t-"+k).hidden=!(state.tab==="ref"&&state.sub===k));
}
let JUDGED=null,FAILED=false;
function renderAll(){
  document.documentElement.lang=LANG;
  document.querySelectorAll("#lang [data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===LANG));
  renderTabs();renderRef();renderToday(JUDGED);
  if(!JUDGED)$("scene").innerHTML=`<div class="empty">${FAILED?L("データを読み込めませんでした","Couldn't load the data"):L("読み込み中…","Loading…")}</div>`;
}
$("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;state.tab=b.dataset.tab;store.set("tab",state.tab);renderTabs();window.scrollTo(0,0)});
$("subtabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;state.sub=b.dataset.sub;store.set("sub",state.sub);renderTabs();window.scrollTo(0,0)});
$("lang").addEventListener("click",e=>{const b=e.target.closest("[data-lang]");if(!b||b.dataset.lang===LANG)return;LANG=b.dataset.lang;try{localStorage.setItem("lang",LANG)}catch(e){}renderAll()});
renderAll();
// read the data for the day; when the page comes back after 7:00 on a new day, read again so the reading moves with the date
let LOADED=0;
const refresh=()=>{LOADED=fortuneDay();load().then(D=>{JUDGED=judge(D);FAILED=false;renderAll()}).catch(e=>{FAILED=true;renderAll();console.error(e)})};
document.addEventListener("visibilitychange",()=>{if(document.hidden)return;if(fortuneDay()!==LOADED)refresh();else renderAll()});
refresh();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
